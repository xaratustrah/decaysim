tau_seed        = 5.025863e-02   # [s] τ_lab (fit from fit_t_start)
fit_t_start     = 0.000000e+00   # [s] first time of the fit (first bin = 0)
sigma_fit_real  = 1.961433e-03   # [s] fit error of τ_lab of the real data (for ρ and σ_corr)
