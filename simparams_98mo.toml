# RionDS input, mo98. Written by the RionSIS notebook (7059 injections): rerun it instead of editing.
[params]
# exponential fit (with σ) of the real summed curve
tau_seed        = 2.641502e-01   # [s] τ_lab (fit from fit_t_start)
fit_t_start     = 4.000000e-01   # [s] first time of the fit (first bin = 0)
sigma_fit_real  = 1.331057e-03   # [s] fit error of τ_lab of the real data (for ρ and σ_corr)
exp_data_file   = "/home/carlo/Desktop/PhD/coding/git/RionDS/exp_98mo.npz"   # real summed curve, overlaid in the plots
# single injections   (A1 = 1.1966 ± 0.0004, σ0 = 0.6540 A1 (plateau), k = 0.3973 A1)
mean_ion_number = 12.786481       # μ (± 0.0925)
mean_bkgnd      = 2.582391e-01   # I0
mean_ion        = 1.454842e+00   # I1 = I0 + A1
stdv_bkgnd      = 7.826032e-01   # σ(I0) = σ0·A1
stdv_ion        = 4.754304e-01   # σ(I1) = k·A1
ion_number_r    = 11.32   # width of the ion-number distribution (negative binomial); 0 = Poisson
# data
timestep        = 1.001819e-02   # [s] time bin
